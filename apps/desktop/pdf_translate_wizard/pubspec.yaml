name: pdf_translate_wizard
description: PDF Translate Wizard - Desktop application for PDF translation
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^2.5.0
  go_router: ^13.0.0
  file_picker: ^6.0.0
  flutter_secure_storage: ^9.0.0
  pdf: ^3.10.4
  printing: ^5.13.0
  path_provider: ^2.1.0
  sqlite3: ^2.3.0
  uuid: ^4.0.0
  json_annotation: ^4.8.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
